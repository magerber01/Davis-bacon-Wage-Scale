<style>
  :root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#f2f3f5}

  }
  textarea{min-height:120px;resize:vertical}
  .options{display:grid;gap:12px}
  .opt{appearance:none;border:2px solid #bbb;background:#fff;border-radius:12px;padding:17px 16px;font-size:20px;font-weight:650;text-align:left;cursor:pointer}

  .nav{display:flex;gap:10px;padding:0 20px 22px}
  button{font:inherit}
  .nav button,.action{border:0;border-radius:10px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer}
  #back{background:#e8eaed;color:#111}
  #next{background:#111;color:#fff;flex:1}
  #next:disabled{opacity:.35;cursor:not-allowed}
  .fixed{padding:12px 14px;background:#f6f6f6;border-radius:10px;font-size:19px;font-weight:700}
  .preview-wrap{display:none}
  .preview-actions{display:flex;gap:10px;flex-wrap:wrap;padding:15px 0}
  .action{background:#111;color:white;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .secondary{background:#e6e7e9;color:#111}
  .disabled{opacity:.45;pointer-events:none}
  .pdf-status{width:100%;font-size:14px;color:#555;margin:0 0 4px}
  #formPreview{width:100%;height:auto;display:block;background:white;border:1px solid #aaa}
  #notesPage{display:none;background:white;border:1px solid #aaa;margin-top:16px;padding:48px;min-height:900px}
  #notesPage h2{margin-top:0;font-size:22px}
  .note-row{margin:16px 0;font-size:15px;line-height:1.4}
  .note-row b{display:block;margin-bottom:4px}
  .error{color:#a40000;font-size:14px;margin-top:10px;display:none}
  @media(max-width:520px){.app{padding:10px}.qtitle{font-size:21px}.step{padding:20px 16px}.nav{padding:0 16px 18px}.opt{font-size:19px}}

    body{background:white}
    .app>.card,.preview-actions,.no-print{display:none!important}
    .preview-wrap{display:block!important;margin:0;padding:0}

  }

function recalc(){visible=questions.filter(q=>!q.show||q.show()); if(idx>=visible.length) idx=visible.length-1}
function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 recalc(); const q=visible[idx];
 progress.style.width=((idx+1)/visible.length*100)+'%';
 let h=`<div class="counter">Question ${idx+1} of ${visible.length}</div><h2 class="qtitle">${escapeHtml(q.title)}</h2>`;
 if(q.hint) h+=`<div class="hint">${escapeHtml(q.hint)}</div>`;
 const v=state[q.id]??'';
 if(q.type==='choice'){
   h+='<div class="options">'+q.options.map(o=>`<button type="button" class="opt ${v===o?'selected':''}" data-value="${o}">${o}</button>`).join('')+'</div>';
 } else if(q.type==='textarea'){
   h+=`<textarea id="input" autocomplete="off">${escapeHtml(v)}</textarea>`;
 } else {
   h+=`<input id="input" type="${q.type}" value="${escapeHtml(v)}" ${q.type==='text'?'autocomplete="off"':''}>`;
 }
 h+='<div class="error" id="err">Please answer this question before continuing.</div>';
 step.innerHTML=h;
 back.style.visibility=idx===0?'hidden':'visible';
 next.textContent=idx===visible.length-1?'Finish & Create PDF':'Next';
 if(q.type==='choice'){
   step.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state[q.id]=b.dataset.value; render();});
 } else {
   const inp=document.getElementById('input'); inp.addEventListener('input',()=>state[q.id]=inp.value);
   setTimeout(()=>inp.focus(),50);
 }
}
function valid(q){if(!q.required)return true; const v=state[q.id];return v!==undefined && String(v).trim()!==''}
next.onclick=()=>{

 recalc();
 if(idx<visible.length-1){idx++;render()} else showPreview();
};
back.onclick=()=>{if(idx>0){idx--;render()}};

function drawText(ctx,text,x,y,maxW,font='26px Arial',lineH=31){
 ctx.font=font;ctx.fillStyle='#000';ctx.textBaseline='top';
 const words=String(text||'').split(/\s+/);let line='',yy=y;
 for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW && line){ctx.fillText(line,x,yy);yy+=lineH;line=w}else line=t}
 if(line)ctx.fillText(line,x,yy);return yy+lineH;
}
function xmark(ctx,x,y){ctx.save();ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-9,y-9);ctx.lineTo(x+9,y+9);ctx.moveTo(x+9,y-9);ctx.lineTo(x-9,y+9);ctx.stroke();ctx.restore()}
function answer(ctx,val,yesXY,noXY,unsureXY){
 if(val==='Yes') xmark(ctx,...yesXY);
 else if(val==='No') xmark(ctx,...noXY);
 else if(val==='Unsure' && unsureXY){
   const [ux,uy,usize=18]=unsureXY;
   ctx.font=`bold ${usize}px Arial`;
   ctx.fillStyle='#000';
   ctx.textBaseline='top';
   ctx.fillText('UNSURE',ux,uy);
 }
}
function whiteBox(ctx,x,y,w,h){ctx.fillStyle='white';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h)}

function buildNotes(){
 const rows=[];
 if(state.poster==='No') rows.push(['Wage rate poster - Do you know where it is now?',state.posterNow]);
 if(state.poster==='Unsure') rows.push(['Wage rate poster - Were you informed of where it is now?',state.posterInformed]);
 if(state.decision==='No') rows.push(['Wage decision - Do you know where it is now?',state.decisionNow]);
 if(state.decision==='Unsure') rows.push(['Wage decision - Were you informed of where it is now?',state.decisionInformed]);
 if(state.jobFair==='No') rows.push(['Job assignments - Why',state.jobWhy]);
 if(state.equipFair==='No') rows.push(['Equipment assignment - Why',state.equipWhy]);
 if(state.training==='No') rows.push(['Adequate training - Why',state.trainingWhy]);
 if(state.grievances==='Yes') rows.push(['Complaints / grievances - Describe',state.grievanceDesc]);
 const page=document.getElementById('notesPage'),c=document.getElementById('notesContent');
 if(!rows.length){page.style.display='none';c.innerHTML='';return}
 page.style.display='block';
 c.innerHTML=`<div class="note-row"><b>Employee</b>${escapeHtml(state.employee)}</div><div class="note-row"><b>Employer / Contractor</b>${escapeHtml(state.employer)}</div>`+
 rows.map(r=>`<div class="note-row"><b>${escapeHtml(r[0])}</b>${escapeHtml(r[1]||'')}</div>`).join('');
}

}
function pdfFilename(){
 const iso=(state.date||localISODate()).replace(/[^0-9-]/g,'');
 const parts=iso.split('-');
 const d=parts.length===3 ? `${parts[1]}-${parts[2]}-${parts[0]}` : iso;
 return `WRI_${d}_${safeFilePart(state.employee)}_${safeFilePart(state.employer)}.pdf`;
}
function followupRows(){
 const rows=[];
 if(state.poster==='No') rows.push(['Wage rate poster - Do you know where it is now?',state.posterNow]);
 if(state.poster==='Unsure') rows.push(['Wage rate poster - Were you informed of where it is now?',state.posterInformed]);
 if(state.decision==='No') rows.push(['Wage decision - Do you know where it is now?',state.decisionNow]);
 if(state.decision==='Unsure') rows.push(['Wage decision - Were you informed of where it is now?',state.decisionInformed]);
 if(state.jobFair==='No') rows.push(['Job assignments - Why',state.jobWhy]);
 if(state.equipFair==='No') rows.push(['Equipment assignment - Why',state.equipWhy]);
 if(state.training==='No') rows.push(['Adequate training - Why',state.trainingWhy]);
 if(state.grievances==='Yes') rows.push(['Complaints / grievances - Describe',state.grievanceDesc]);
 return rows;
}
function addWrappedPdfText(pdf,text,x,y,maxWidth,fontSize=10,bold=false){
 pdf.setFont('helvetica',bold?'bold':'normal');
 pdf.setFontSize(fontSize);
 const lines=pdf.splitTextToSize(String(text||''),maxWidth);
 pdf.text(lines,x,y);
 return y + lines.length*(fontSize*1.25);
}
function addFollowupPages(pdf){
 const rows=followupRows();
 if(!rows.length) return;
 let y=54;
 const left=42, width=528, bottom=748;
 const newPage=()=>{
   pdf.addPage('letter','portrait');
   y=54;
   pdf.setFont('helvetica','bold'); pdf.setFontSize(15);
   pdf.text('DAVIS-BACON EMPLOYEE INTERVIEW - FOLLOW-UP DETAILS',left,y);
   y+=28;
   y=addWrappedPdfText(pdf,`Employee: ${state.employee||''}`,left,y,width,10,true)+8;
   y=addWrappedPdfText(pdf,`Employer / Contractor: ${state.employer||''}`,left,y,width,10,true)+18;
 };
 newPage();
 for(const [label,value] of rows){
   const labelLines=pdf.splitTextToSize(label,width);
   const valueLines=pdf.splitTextToSize(String(value||''),width);
   const needed=(labelLines.length+valueLines.length)*14+28;
   if(y+needed>bottom) newPage();
   pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.text(labelLines,left,y);
   y+=labelLines.length*13+5;
   pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.text(valueLines,left,y);
   y+=valueLines.length*13+18;
 }
}
function generatePdf(){
 const status=document.getElementById('pdfStatus');
 const download=document.getElementById('downloadPdf');
 const open=document.getElementById('openPdf');
 status.textContent='Generating PDF…';
 download.classList.add('disabled'); open.classList.add('disabled');
 try{
   if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('PDF library did not load');
   const {jsPDF}=window.jspdf;
   const canvas=document.getElementById('formPreview');
   const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'letter',compress:true});
   const image=canvas.toDataURL('image/jpeg',0.92);
   pdf.addImage(image,'JPEG',0,0,612,792,undefined,'FAST');
   addFollowupPages(pdf);
   const blob=pdf.output('blob');
   if(pdfObjectUrl) URL.revokeObjectURL(pdfObjectUrl);
   pdfObjectUrl=URL.createObjectURL(blob);
   const filename=pdfFilename();
   download.href=pdfObjectUrl; download.download=filename;
   open.href=pdfObjectUrl;
   download.classList.remove('disabled'); open.classList.remove('disabled');
   status.textContent=`PDF ready: ${filename}`;
 }catch(err){
   console.error(err);
   status.textContent='PDF generation failed. Use Print (backup), or refresh and try again.';
 }
}

document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('editBtn').onclick=()=>{document.getElementById('previewWrap').style.display='none';document.getElementById('wizard').style.display='block';idx=0;render();window.scrollTo(0,0)};
document.getElementById('newBtn').onclick=()=>{if(confirm('Clear this interview and start a new one?')){if(pdfObjectUrl){URL.revokeObjectURL(pdfObjectUrl);pdfObjectUrl=null}for(const k of Object.keys(state)){if(k!=='interviewer')delete state[k]}state.date=localISODate();idx=0;document.getElementById('previewWrap').style.display='none';document.getElementById('wizard').style.display='block';render();window.scrollTo(0,0)}};
render();
</script>
